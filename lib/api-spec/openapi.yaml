    delete:
      operationId: removeRepairPart
      tags: [repairs]
      summary: Remove a part and restore stock
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: partId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed

  /operations/products/search:
    get:
      operationId: searchOperationProducts
      tags: [products]
      summary: Search active products in the current store
      parameters:
        - { name: q, in: query, schema: { type: string } }
      responses:
        "200": { description: Products, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Product" } } } } }
  /operations/inventory/summary:
    get:
      operationId: getInventorySummary
      tags: [operations]
      summary: Inventory summary for the current store
      responses:
        "200": { description: Inventory summary, content: { application/json: { schema: { type: object } } } }
  /operations/inventory/movements:
    get:
      operationId: getInventoryMovements
      tags: [operations]
      summary: List append-only inventory movements
      responses:
        "200": { description: Movements, content: { application/json: { schema: { type: array, items: { type: object } } } } }
  /operations/inventory/adjust:
    post:
      operationId: adjustInventory
      tags: [operations]
      summary: Manager inventory adjustment
      requestBody:
        required: true
        content:
          application/json:
            schema:
                $ref: "#/components/schemas/InventoryAdjustmentInput"
      responses:
        "201": { description: Movement recorded, content: { application/json: { schema: { type: object } } } }
  /operations/suppliers:
    get:
      operationId: getSuppliers
      tags: [operations]
      responses:
        "200": { description: Suppliers, content: { application/json: { schema: { type: array, items: { type: object } } } } }
    post:
      operationId: createSupplier
      tags: [operations]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SupplierInput" } } }
      responses:
        "201": { description: Supplier created, content: { application/json: { schema: { type: object } } } }
  /operations/purchase-orders:
    get:
      operationId: getPurchaseOrders
      tags: [operations]
      responses:
        "200": { description: Purchase orders, content: { application/json: { schema: { type: array, items: { type: object } } } } }
    post:
      operationId: createPurchaseOrder
      tags: [operations]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PurchaseOrderInput" } } }
      responses:
        "201": { description: Purchase order created, content: { application/json: { schema: { type: object } } } }
  /operations/purchase-orders/{id}/receive:
    post:
      operationId: receivePurchaseOrder
      tags: [operations]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PurchaseReceiptInput" } } }
      responses:
        "201": { description: Receipt created, content: { application/json: { schema: { type: object } } } }
  /operations/reservations:
    post:
      operationId: reserveInventory
      tags: [operations]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ReservationInput" } } }
      responses:
        "201": { description: Reservation created, content: { application/json: { schema: { type: object } } } }
  /operations/reservations/{id}/release:
    post:
      operationId: releaseInventoryReservation
      tags: [operations]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200": { description: Reservation released, content: { application/json: { schema: { type: object } } } }

components:
  schemas:
    InventoryAdjustmentInput:
      type: object
      required: [productId, quantity, reason, idempotencyKey]
      properties:
        productId: { type: integer }
        quantity: { type: number }
        reason: { type: string }
        idempotencyKey: { type: string, minLength: 8 }
    SupplierInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        email: { type: string, format: email }
    PurchaseOrderInput:
      type: object
      required: [supplierId, lines]
      properties:
        supplierId: { type: integer }
        lines: { type: array, items: { type: object } }
    PurchaseReceiptInput:
      type: object
      required: [idempotencyKey, lines]
      properties:
        idempotencyKey: { type: string }
        lines: { type: array, items: { type: object } }
    ReservationInput:
      type: object
      required: [productId, quantity]
      properties:
        productId: { type: integer }
        quantity: { type: number }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    # ── Employee authentication ──
    AuthSetupStatus:
      type: object
      required: [needsSetup]
      properties:
        needsSetup: { type: boolean }

    SignInEmployee:
      type: object
      required: [id, name, role, maxDiscountPct]
      properties:
        id: { type: integer }
        name: { type: string }
        role: { type: string, enum: [admin, manager, staff] }
        maxDiscountPct: { type: number }

    Employee:
      type: object
      required: [id, name, role, maxDiscountPct, active, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: ["string", "null"] }
        role: { type: string, enum: [admin, manager, staff] }
        maxDiscountPct: { type: number }
        active: { type: boolean }
        createdAt: { type: string }

    AuthenticatedEmployee:
      type: object
      required: [id, name, role, maxDiscountPct, active, requiresPinChange]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: ["string", "null"] }
        role: { type: string, enum: [admin, manager, staff] }
        maxDiscountPct: { type: number }
        active: { type: boolean }
        requiresPinChange: { type: boolean }

    BootstrapAdminInput:
      type: object
      required: [name, pin]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        pin: { type: string, pattern: "^[0-9]{4,8}$" }

    SignInInput:
      type: object
      required: [employeeId, pin]
      additionalProperties: false
      properties:
        employeeId: { type: integer, minimum: 1 }
        pin: { type: string, pattern: "^[0-9]{4,8}$" }

    AuthenticatedSession:
      type: object
      required: [authenticated, employee]
      properties:
        authenticated: { type: boolean, enum: [true] }
        employee:
          $ref: "#/components/schemas/AuthenticatedEmployee"
        recoveryCode: { type: string }

    AuthSession:
      oneOf:
        - $ref: "#/components/schemas/AuthenticatedSession"
        - type: object
          required: [authenticated]
          properties:
            authenticated: { type: boolean, enum: [false] }

    PinResetRequestInput:
      type: object
      required: [employeeId]
      additionalProperties: false
      properties:
        employeeId: { type: integer, minimum: 1 }
        note: { type: string, maxLength: 500 }

    PinResetRequestSubmitted:
      type: object
      required: [submitted]
      properties:
        submitted: { type: boolean, enum: [true] }

    PinResetRequest:
      type: object
      required: [id, employeeId, employeeName, employeeRole, status, requestedAt]
      properties:
        id: { type: integer }
        employeeId: { type: integer }
        employeeName: { type: string }
        employeeRole: { type: string, enum: [admin, manager, staff] }
        status: { type: string, enum: [pending, approved, denied] }
        note: { type: ["string", "null"] }
        requestedAt: { type: string }
        reviewedAt: { type: ["string", "null"] }

    PinResetApproval:
      type: object
      required: [requestId, employeeId, temporaryPin, expiresAt]
      properties:
        requestId: { type: integer }
        employeeId: { type: integer }
        temporaryPin: { type: string, pattern: "^[0-9]{6}$" }
        expiresAt: { type: string }

    ChangePinInput:
      type: object
      required: [newPin]
      additionalProperties: false
      properties:
        newPin: { type: string, pattern: "^[0-9]{4,8}$" }

    AdminRecoveryInput:
      type: object
      required: [recoveryCode, newPin]
      additionalProperties: false
      properties:
        recoveryCode: { type: string, minLength: 24, maxLength: 29 }
        newPin: { type: string, pattern: "^[0-9]{4,8}$" }

    RecoveryCodeResponse:
      type: object
      required: [recoveryCode]
      properties:
        recoveryCode: { type: string, pattern: "^[A-F0-9]{24}$" }

    LogoutResponse:
      type: object
      required: [loggedOut]
      properties:
        loggedOut: { type: boolean }

    EmployeeInput:
      type: object
      required: [name, pin, role, maxDiscountPct]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        pin: { type: string, pattern: "^[0-9]{4,8}$" }
        role: { type: string, enum: [admin, manager, staff] }
        maxDiscountPct: { type: number, minimum: 0, maximum: 100 }
        active: { type: boolean }

    EmployeeUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        email: { type: ["string", "null"], format: email, maxLength: 254 }
        pin: { type: string, pattern: "^[0-9]{4,8}$" }
        role: { type: string, enum: [admin, manager, staff] }
        maxDiscountPct: { type: number, minimum: 0, maximum: 100 }
        active: { type: boolean }

    # ── Product ──
    Product:
      type: object
      required: [id, name, sku, category, price, stock, createdAt]
      properties:
        id:             { type: integer }
        name:           { type: string }
        sku:            { type: string }
        category:       { type: string }
        description:    { type: ["string", "null"] }
        price:          { type: number }
        cost:           { type: ["number", "null"] }
        stock:          { type: integer }
        unit:           { type: string }
        trackSerials:   { type: boolean }
        warrantyDays:   { type: ["integer", "null"] }
        isRefurbished:  { type: boolean }
        isBundle:       { type: boolean }
        createdAt:      { type: string }

    ProductInput:
      type: object
      required: [name, sku, category, price, stock]
      properties:
        name:           { type: string }
        sku:            { type: string }
        category:       { type: string }
        description:    { type: string }
        price:          { type: number }
        cost:           { type: number }
        stock:          { type: integer }
        unit:           { type: string }
        trackSerials:   { type: boolean }
        warrantyDays:   { type: integer }
        isRefurbished:  { type: boolean }
        isBundle:       { type: boolean }

    ProductUpdate:
      type: object
      properties:
        name:           { type: string }
        sku:            { type: string }
        category:       { type: string }
        description:    { type: string }
        price:          { type: number }
        cost:           { type: number }
        stock:          { type: integer }
        unit:           { type: string }
        trackSerials:   { type: boolean }
        warrantyDays:   { type: integer }
        isRefurbished:  { type: boolean }
        isBundle:       { type: boolean }

    # ── Service ──
    Service:
      type: object
      required: [id, name, category, price, createdAt]
      properties:
        id:           { type: integer }
        name:         { type: string }
        category:     { type: string }
        description:  { type: ["string", "null"] }
        price:        { type: number }
        duration:     { type: ["string", "null"] }
        createdAt:    { type: string }

    ServiceInput:
      type: object
      required: [name, category, price]
      properties:
        name:         { type: string }
        category:     { type: string }
        description:  { type: string }
        price:        { type: number }
        duration:     { type: string }

    ServiceUpdate:
      type: object
      properties:
        name:         { type: string }
        category:     { type: string }
        description:  { type: string }
        price:        { type: number }
        duration:     { type: string }

    # ── Customer ──
    Customer:
      type: object
      required: [id, name, createdAt]
      properties:
        id:           { type: integer }
        name:         { type: string }
        email:        { type: ["string", "null"] }
        phone:        { type: ["string", "null"] }
        address:      { type: ["string", "null"] }
        notes:        { type: ["string", "null"] }
        isLoyaltyMember: { type: boolean }
        loyaltyDiscountPct: { type: number }
        loyaltyPoints: { type: integer }
        referralCode: { type: ["string", "null"] }
        emailConsent: { type: boolean }
        smsConsent: { type: boolean }
        marketingConsent: { type: boolean }
        consentSource: { type: ["string", "null"] }
        consentReviewedAt: { type: ["string", "null"] }
        anonymizedAt: { type: ["string", "null"] }
        totalSpent:   { type: number }
        totalOrders:  { type: integer }
        createdAt:    { type: string }

    CustomerInput:
      type: object
      required: [name]
      properties:
        name:         { type: string }
        email:        { type: string }
        phone:        { type: string }
        address:      { type: string }
        notes:        { type: string }
        isLoyaltyMember: { type: boolean }
        loyaltyDiscountPct: { type: number, minimum: 0, maximum: 100 }
        loyaltyPoints: { type: integer, minimum: 0 }
        emailConsent: { type: boolean }
        smsConsent: { type: boolean }
        marketingConsent: { type: boolean }
        consentSource: { type: string, maxLength: 120 }

    CustomerUpdate:
      type: object
      properties:
        name:         { type: string }
        email:        { type: string }
        phone:        { type: string }
        address:      { type: string }
        notes:        { type: string }
        isLoyaltyMember: { type: boolean }
        loyaltyDiscountPct: { type: number, minimum: 0, maximum: 100 }
        loyaltyPoints: { type: integer, minimum: 0 }
        emailConsent: { type: boolean }
        smsConsent: { type: boolean }
        marketingConsent: { type: boolean }
        consentSource: { type: string, maxLength: 120 }

    # ── Line Item ──
    LineItem:
      type: object
      required: [id, type, name, quantity, unitPrice, total]
      properties:
        id:           { type: integer }
        type:         { type: string }
        productId:    { type: ["integer", "null"] }
        serviceId:    { type: ["integer", "null"] }
        name:         { type: string }
        description:  { type: ["string", "null"] }
        quantity:     { type: number }
        unitPrice:    { type: number }
        discount:     { type: number }
        total:        { type: number }
        taxExempt:    { type: boolean }

    LineItemInput:
      type: object
      required: [type, name, quantity, unitPrice]
      properties:
        type:         { type: string }
        productId:    { type: integer }
        serviceId:    { type: integer }
        name:         { type: string }
        description:  { type: string }
        quantity:     { type: number }
        unitPrice:    { type: number }
        discount:     { type: number }
        taxExempt:    { type: boolean }

    # ── Sale ──
    Sale:
      type: object
      required: [id, invoiceNumber, status, subtotal, tax, total, createdAt]
      properties:
        id:             { type: integer }
        invoiceNumber:  { type: string }
        customerId:     { type: ["integer", "null"] }
        customerName:   { type: ["string", "null"] }
        customerEmail:  { type: ["string", "null"] }
        status:         { type: string }
        subtotal:       { type: number }
        taxRate:        { type: number }
        tax:            { type: number }
        taxProfileId:   { type: ["integer", "null"] }
        taxProvinceCode: { type: ["string", "null"] }
        taxProfileSnapshot: { type: ["object", "null"], additionalProperties: true }
        discount:       { type: number }
        total:          { type: number }
        notes:          { type: ["string", "null"] }
        paymentMethod:  { type: ["string", "null"] }
        dueDate:        { type: ["string", "null"] }
        paidAt:         { type: ["string", "null"] }
        employeeId:     { type: ["integer", "null"] }
        employeeName:   { type: ["string", "null"] }
        storeId:        { type: ["integer", "null"] }
        balance:        { type: number }
        payments:
          type: array
          items: { $ref: "#/components/schemas/Payment" }
        events:
          type: array
          items: { $ref: "#/components/schemas/SaleEvent" }
        items:
          type: array
          items:
            $ref: "#/components/schemas/LineItem"
        createdAt:      { type: string }

    SalePage:
      type: object
      required: [items, pagination, summary]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Sale" }
        pagination: { $ref: "#/components/schemas/Pagination" }
        summary: { $ref: "#/components/schemas/SalesSummary" }

    Pagination:
      type: object
      required: [page, limit, total, totalPages]
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }

    SalesSummary:
      type: object
      required: [count, total, outstanding]
      properties:
        count: { type: integer }
        total: { type: number }
        outstanding: { type: number }

    Payment:
      type: object
      required: [id, saleId, amount, method, kind, createdAt]
      properties:
        id: { type: integer }
        saleId: { type: integer }
        amount: { type: number }
        method: { type: string }
        reference: { type: ["string", "null"] }
        kind: { type: string }
        note: { type: ["string", "null"] }
        employeeId: { type: ["integer", "null"] }
        employeeName: { type: ["string", "null"] }
        createdAt: { type: string }

    SaleEvent:
      type: object
      required: [id, saleId, action, createdAt]
      properties:
        id: { type: integer }
        saleId: { type: integer }
        action: { type: string }
        fromStatus: { type: ["string", "null"] }
        toStatus: { type: ["string", "null"] }
        note: { type: ["string", "null"] }
        employeeId: { type: ["integer", "null"] }
        employeeName: { type: ["string", "null"] }
        createdAt: { type: string }

    SaleInput:
      type: object
      required: [items]
      properties:
        customerId:     { type: integer }
        customerName:   { type: string }
        customerEmail:  { type: string }
        status:         { type: string }
        idempotencyKey:  { type: string, minLength: 8, maxLength: 100 }
        taxRate:        { type: number }
        discount:       { type: number }
        notes:          { type: string }
        paymentMethod:  { type: string }
        dueDate:        { type: string }
        transactionDate: { type: string, format: date }
        items:
          type: array
          items:
            $ref: "#/components/schemas/LineItemInput"

    SaleUpdate:
      type: object
      properties:
        customerId:     { type: integer }
        customerName:   { type: string }
        customerEmail:  { type: string }
        status:         { type: string }
        taxRate:        { type: number }
        discount:       { type: number }
        notes:          { type: string }
        paymentMethod:  { type: string }
        dueDate:        { type: string }
        transactionDate: { type: string, format: date }
        paidAt:         { type: string }
        items:
          type: array
          items:
            $ref: "#/components/schemas/LineItemInput"

    RecyclingReceipt:
      type: object
      required: [id, storeId, customerName, customerPhone, deviceType, deviceBrand, deviceModel, deviceColour, declaredCondition, accessories, handoffDate, status, createdAt]
      properties:
        id: { type: integer }
        documentNumber: { type: ["string", "null"] }
        storeId: { type: integer }
        saleId: { type: ["integer", "null"] }
        customerId: { type: ["integer", "null"] }
        customerName: { type: string }
        customerPhone: { type: string }
        customerEmail: { type: ["string", "null"] }
        deviceType: { type: string }
        deviceBrand: { type: string }
        deviceModel: { type: string }
        deviceColour: { type: string }
        declaredCondition: { type: string, enum: [working, damaged, bricked, unknown] }
        accessories: { type: string }
        serialOrImei: { type: ["string", "null"] }
        handoffDate: { type: string, format: date }
        receivedByEmployeeId: { type: ["integer", "null"] }
        receivedByEmployeeName: { type: ["string", "null"] }
        status: { type: string, enum: [draft, finalized] }
        createdAt: { type: string, format: date-time }
        finalizedAt: { type: ["string", "null"], format: date-time }

    RecyclingReceiptInput:
      type: object
      required: [customerName, customerPhone, deviceType, deviceBrand, deviceModel, deviceColour, declaredCondition, accessories, handoffDate]
      additionalProperties: false
      properties:
        saleId: { type: integer, minimum: 1 }
        customerId: { type: integer, minimum: 1 }
        customerName: { type: string, minLength: 1, maxLength: 200 }
        customerPhone: { type: string, minLength: 1, maxLength: 50 }
        customerEmail: { type: string, format: email, maxLength: 254 }
        deviceType: { type: string, minLength: 1, maxLength: 100 }
        deviceBrand: { type: string, minLength: 1, maxLength: 100 }
        deviceModel: { type: string, minLength: 1, maxLength: 150 }
        deviceColour: { type: string, minLength: 1, maxLength: 100 }
        declaredCondition: { type: string, enum: [working, damaged, bricked, unknown] }
        accessories: { type: string, minLength: 1, maxLength: 500 }
        serialOrImei: { type: string, maxLength: 150 }
        handoffDate: { type: string, format: date }

    RecyclingReceiptUpdate:
      type: object
      additionalProperties: false
      properties:
        customerId: { type: ["integer", "null"], minimum: 1 }
        customerName: { type: string, minLength: 1, maxLength: 200 }
        customerPhone: { type: string, minLength: 1, maxLength: 50 }
        customerEmail: { type: ["string", "null"], format: email, maxLength: 254 }
        deviceType: { type: string, minLength: 1, maxLength: 100 }
        deviceBrand: { type: string, minLength: 1, maxLength: 100 }
        deviceModel: { type: string, minLength: 1, maxLength: 150 }
        deviceColour: { type: string, minLength: 1, maxLength: 100 }
        declaredCondition: { type: string, enum: [working, damaged, bricked, unknown] }
        accessories: { type: string, minLength: 1, maxLength: 500 }
        serialOrImei: { type: ["string", "null"], maxLength: 150 }
        handoffDate: { type: string, format: date }

    PaymentInput:
      type: object
      required: [amount, method]
      properties:
        amount: { type: number, minimum: 0.01 }
        method: { type: string, minLength: 1, maxLength: 80 }
        reference: { type: string, maxLength: 160 }
        note: { type: string, maxLength: 500 }

    RefundInput:
      type: object
      required: [amount, method]
      properties:
        amount: { type: number, minimum: 0.01 }
        method: { type: string, minLength: 1, maxLength: 80 }
        reference: { type: string, maxLength: 160 }
        note: { type: string, maxLength: 500 }

    StatusNoteInput:
      type: object
      properties:
        note: { type: string, maxLength: 500 }

    # ── Quotation ──
    Quotation:
      type: object
      required: [id, quoteNumber, status, subtotal, tax, total, createdAt]
      properties:
        id:             { type: integer }
        quoteNumber:    { type: string }
        customerId:     { type: ["integer", "null"] }
        customerName:   { type: ["string", "null"] }
        customerEmail:  { type: ["string", "null"] }
        status:         { type: string }
        subtotal:       { type: number }
        taxRate:        { type: number }
        tax:            { type: number }
        discount:       { type: number }
        total:          { type: number }
        taxProfileId:   { type: ["integer", "null"] }
        taxProvinceCode: { type: ["string", "null"] }
        taxProfileSnapshot: { type: ["object", "null"], additionalProperties: true }
        notes:          { type: ["string", "null"] }
        validUntil:     { type: ["string", "null"] }
        expiresAt:      { type: ["string", "null"] }
        items:
          type: array
          items:
            $ref: "#/components/schemas/LineItem"
        createdAt:      { type: string }

    QuotationInput:
      type: object
      required: [items]
      properties:
        customerId:     { type: integer }
        customerName:   { type: string }
        customerEmail:  { type: string }
        taxRate:        { type: number }
        discount:       { type: number }
        notes:          { type: string }
