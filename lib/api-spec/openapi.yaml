        invoiceCount: { type: integer }
        subtotal: { type: number }
        tax: { type: number }
        total: { type: number }

    CustomerFinanceProfile:
      type: object
      required: [customer, stats, sales, repairs, transactions, timeline]
      properties:
        customer: { type: object }
