        customerId: { type: integer, minimum: 1 }
        saleId: { type: integer, minimum: 1 }
        repairId: { type: integer, minimum: 1 }
        event: { type: string, enum: [invoice, estimate, repair-status, pickup, payment, reminder] }
        channel: { type: string, enum: [email, sms] }

    NotificationEvent:
      allOf:
        - $ref: "#/components/schemas/NotificationEventInput"
        - type: object
          required: [id, status, attempts, unsubscribed, createdAt]
          properties:
            id: { type: integer }
            storeId: { type: integer }
            destinationMasked: { type: ["string", "null"] }
            status: { type: string, enum: [queued, sent, failed, skipped] }
            attempts: { type: integer }
            lastError: { type: ["string", "null"] }
            providerMessageId: { type: ["string", "null"] }
            nextRetryAt: { type: ["string", "null"] }
            sentAt: { type: ["string", "null"] }
            unsubscribed: { type: boolean }
            createdAt: { type: string }

