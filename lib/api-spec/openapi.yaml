openapi: 3.1.0
info:
  title: Mobilinq API
  version: 0.2.0
  description: Mobilinq store operations API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Employee PIN authentication and sessions
  - name: employees
    description: Employee administration
  - name: products
    description: Product inventory
  - name: services
    description: Repair services
  - name: customers
    description: Customer management
  - name: sales
    description: Sales and invoices
  - name: quotations
    description: Price quotations
  - name: reports
    description: Business reports
  - name: settings
    description: App settings
  - name: repairs
    description: Repair tickets and work orders
  - name: stores
    description: Location context and administration
  - name: audit
    description: Privacy-safe manager audit trail
  - name: sync
    description: Offline operation replay and reconciliation
  - name: tax-profiles
    description: Canadian store tax profiles
  - name: customer-rights
    description: Reviewed internal customer-rights guidance
  - name: recycling
    description: Zero-value device recycling handoff receipts

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /stores:
    get:
      operationId: getStores
      tags: [stores]
      summary: List active and inactive stores
      responses:
        "200":
          description: Store locations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Store"
    post:
      operationId: createStore
      tags: [stores]
      summary: Create a store location
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreInput"
      responses:
        "201":
          description: Store created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Store"

  /stores/{id}:
    patch:
      operationId: updateStore
      tags: [stores]
      summary: Update a store location
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreUpdate"
      responses:
        "200":
          description: Store updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Store"

  /stores/current:
    get:
      operationId: getCurrentStore
      tags: [stores]
      summary: Get the store selected for this employee session
      responses:
        "200":
          description: Current store context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentStore"
    patch:
      operationId: setCurrentStore
      tags: [stores]
      summary: Select the current store for this session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetCurrentStoreInput"
      responses:
        "200":
          description: Store selected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentStore"

  /tax-profiles:
    get:
      operationId: getTaxProfiles
      tags: [tax-profiles]
      summary: List tax profiles for the current store
      parameters:
        - name: includeDisabled
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Store tax profiles and active profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaxProfileList" }
    post:
      operationId: createTaxProfile
      tags: [tax-profiles]
      summary: Create an effective-dated Canadian tax profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaxProfileInput" }
      responses:
        "201":
          description: Tax profile created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaxProfile" }

  /tax-profiles/{id}:
    patch:
      operationId: updateTaxProfile
      tags: [tax-profiles]
      summary: Update a current-store tax profile
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaxProfileUpdate" }
      responses:
        "200":
          description: Updated tax profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaxProfile" }

  /tax-profiles/{id}/retire:
    post:
      operationId: retireTaxProfile
      tags: [tax-profiles]
      summary: Disable a current-store tax profile
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Retired tax profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaxProfile" }

  /customer-rights:
    get:
      operationId: getCustomerRights
      tags: [customer-rights]
      summary: List reviewed customer-rights guidance
      parameters:
        - { name: provinceCode, in: query, schema: { type: string } }
        - { name: topic, in: query, schema: { type: string } }
        - { name: language, in: query, description: "Published content language. Defaults to English.", schema: { type: string, enum: [en, fr], default: en } }
        - { name: status, in: query, schema: { type: string, enum: [draft, published, retired] } }
      responses:
        "200":
          description: Guidance entries; ordinary employees receive published entries only
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerRightsList" }
    post:
      operationId: createCustomerRightsEntry
      tags: [customer-rights]
      summary: Create a customer-rights guidance entry (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerRightsInput" }
      responses:
        "201":
          description: Guidance entry created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerRightsEntry" }

  /customer-rights/{id}:
    patch:
      operationId: updateCustomerRightsEntry
      tags: [customer-rights]
      summary: Update customer-rights guidance (admin only)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerRightsUpdate" }
      responses:
        "200":
          description: Updated guidance entry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerRightsEntry" }

  /customer-rights/{id}/retire:
    post:
      operationId: retireCustomerRightsEntry
      tags: [customer-rights]
      summary: Retire customer-rights guidance (admin only)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Retired guidance entry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerRightsEntry" }

  /audit-logs:
    get:
      operationId: getAuditLogs
      tags: [audit]
      summary: List a privacy-safe audit trail
      parameters:
        - { name: action, in: query, schema: { type: string, enum: [create, update, delete, login, logout, print, payment, store, authentication, convert, status_change] } }
        - { name: entityType, in: query, schema: { type: string, enum: [sale, quotation, repair, repair_photo, recycling_receipt, customer, product, service, employee, settings, store, backup, tax_profile, guidance_entry] } }
        - { name: storeId, in: query, description: "Location to inspect. If omitted, the employee's current location is used.", schema: { type: integer, minimum: 1 } }
        - { name: actor, in: query, description: "Employee name or ID to match.", schema: { type: string, maxLength: 120 } }
        - { name: dateFrom, in: query, schema: { type: string, maxLength: 40 } }
        - { name: dateTo, in: query, schema: { type: string, maxLength: 40 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200":
          description: Audit events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLog"
    post:
      operationId: recordAuditEvent
      tags: [audit]
      summary: Record a safe client event such as printing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuditEventInput"
      responses:
        "201":
          description: Event recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  recorded: { type: boolean }

  /audit-logs/export:
    get:
      operationId: downloadAuditLogsExport
      tags: [audit]
      summary: Download a privacy-safe filtered audit trail CSV
      parameters:
        - { name: action, in: query, schema: { type: string, enum: [create, update, delete, login, logout, print, payment, store, authentication, convert, status_change] } }
        - { name: entityType, in: query, schema: { type: string, enum: [sale, quotation, repair, repair_photo, recycling_receipt, customer, product, service, employee, settings, store, backup, tax_profile, guidance_entry] } }
        - { name: storeId, in: query, description: "Location to inspect. If omitted, the employee's current location is used.", schema: { type: integer, minimum: 1 } }
        - { name: actor, in: query, description: "Employee name or ID to match.", schema: { type: string, maxLength: 120 } }
        - { name: dateFrom, in: query, schema: { type: string, maxLength: 40 } }
        - { name: dateTo, in: query, schema: { type: string, maxLength: 40 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200":
          description: Privacy-safe audit CSV. Empty results contain only the header row.
          content:
            text/csv: { schema: { type: string } }

  /sync/replay:
    post:
      operationId: replayOfflineOperations
      tags: [sync]
      summary: Replay approved offline operations with server authority
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncReplayInput"
      responses:
        "200":
          description: Operation outcomes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncReplayResponse"
        "409":
          description: One or more operations conflicts with current server state

  # ─── Employee authentication ─────────────────────────────
  /auth/setup-status:
    get:
      operationId: getAuthSetupStatus
      tags: [auth]
      summary: Check whether the first admin account must be created
      responses:
        "200":
          description: Setup status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSetupStatus"

  /auth/employees:
    get:
      operationId: getSignInEmployees
      tags: [auth]
      summary: List active employees available for PIN sign-in
      responses:
        "200":
          description: Minimal active employee profiles; credentials are never returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SignInEmployee"

  /auth/bootstrap:
    post:
      operationId: bootstrapAdmin
      tags: [auth]
      summary: Create the first admin account and sign it in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BootstrapAdminInput"
      responses:
        "201":
          description: Initial admin created and session established
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedSession"
        "409":
          description: Setup was already completed

  /auth/sign-in:
    post:
      operationId: signInEmployee
      tags: [auth]
      summary: Verify an employee PIN and establish a server session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedSession"
        "401":
          description: Incorrect PIN
        "403":
          description: Employee is inactive
        "429":
          description: Sign-in attempts temporarily throttled

  /auth/pin-reset-requests:
    post:
      operationId: createPinResetRequest
      tags: [auth]
      summary: Ask an administrator to review a forgotten PIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PinResetRequestInput"
      responses:
        "202":
          description: Request accepted without revealing account state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PinResetRequestSubmitted"
        "429":
          description: Requests temporarily throttled

  /auth/change-pin:
    post:
      operationId: changeEmployeePin
      tags: [auth]
      summary: Replace the current PIN after a temporary PIN sign-in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePinInput"
      responses:
        "200":
          description: PIN changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedSession"
        "401":
          description: Session is not authenticated

  /auth/admin-recovery:
    post:
      operationId: recoverAdminAccount
      tags: [auth]
      summary: Use a one-time installation recovery code to reset an administrator PIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminRecoveryInput"
      responses:
        "200":
          description: Administrator recovered and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedSession"
        "401":
          description: Recovery code is invalid or already used

  /auth/session:
    get:
      operationId: getAuthSession
      tags: [auth]
      summary: Inspect the current server session
      responses:
        "200":
          description: Current session, without credential fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"

  /auth/logout:
    post:
      operationId: logoutEmployee
      tags: [auth]
      summary: End the current server session
      responses:
        "200":
          description: Session ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResponse"

  /employees:
    get:
      operationId: getEmployees
      tags: [employees]
      summary: List employees (admin only)
      responses:
        "200":
          description: Employees without PIN or hash fields
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Employee"
    post:
      operationId: createEmployee
      tags: [employees]
      summary: Create an employee (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeInput"
      responses:
        "201":
          description: Created employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"

  /employees/{id}:
    patch:
      operationId: updateEmployee
      tags: [employees]
      summary: Update an employee (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeUpdate"
      responses:
        "200":
          description: Updated employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
    delete:
      operationId: deleteEmployee
      tags: [employees]
      summary: Remove an employee (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed

  /employees/pin-reset-requests:
    get:
      operationId: getPinResetRequests
      tags: [employees]
      summary: List employee PIN reset requests (admin only)
      responses:
        "200":
          description: PIN reset requests without credential data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PinResetRequest"

  /employees/pin-reset-requests/{id}/approve:
    post:
      operationId: approvePinResetRequest
      tags: [employees]
      summary: Issue a short-lived temporary PIN for a reset request (admin only)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Temporary PIN, shown only in this response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PinResetApproval"

  /employees/pin-reset-requests/{id}/deny:
    post:
      operationId: denyPinResetRequest
      tags: [employees]
      summary: Deny a pending employee PIN reset request (admin only)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Request denied

  /employees/recovery-code:
    post:
      operationId: rotateAdminRecoveryCode
      tags: [employees]
      summary: Create a new one-time administrator recovery code (admin only)
      responses:
        "200":
          description: Recovery code, shown only in this response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodeResponse"

  # ─── Products ───────────────────────────────────────────
  /products:
    get:
      operationId: getProducts
      tags: [products]
      summary: List all products
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [products]
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    patch:
      operationId: updateProduct
      tags: [products]
      summary: Update a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    delete:
      operationId: deleteProduct
      tags: [products]
      summary: Delete a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── Services ────────────────────────────────────────────
  /services:
    get:
      operationId: getServices
      tags: [services]
      summary: List all repair services
      responses:
        "200":
          description: List of services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"
    post:
      operationId: createService
      tags: [services]
      summary: Create a repair service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"

  /services/{id}:
    patch:
      operationId: updateService
      tags: [services]
      summary: Update a service
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceUpdate"
      responses:
        "200":
          description: Updated service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
    delete:
      operationId: deleteService
      tags: [services]
      summary: Delete a service
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── Customers ───────────────────────────────────────────
  /customers:
    get:
      operationId: getCustomers
      tags: [customers]
      summary: List all customers
      parameters:
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Customer"
    post:
      operationId: createCustomer
      tags: [customers]
      summary: Create a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"

  /customers/{id}:
    get:
      operationId: getCustomer
      tags: [customers]
      summary: Get a customer with purchase history
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
    patch:
      operationId: updateCustomer
      tags: [customers]
      summary: Update a customer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerUpdate"
      responses:
        "200":
          description: Updated customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
    delete:
      operationId: deleteCustomer
      tags: [customers]
      summary: Delete a customer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /finance/customers/{id}:
    get:
      operationId: getCustomerFinance
      tags: [finance]
      summary: Get a privacy-safe customer finance profile and timeline
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Customer finance profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerFinanceProfile"

  /finance/customers/{id}/preferences:
    patch:
      operationId: updateCustomerPreferences
      tags: [finance]
      summary: Update consent-aware notification preferences
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerPreferencesUpdate"
      responses:
        "200":
          description: Updated preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerPreferences"

  /finance/transactions:
    post:
      operationId: createFinanceTransaction
      tags: [finance]
      summary: Record an idempotent repair deposit, payment, refund or credit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceTransactionInput"
      responses:
        "201":
          description: Ledger transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceTransaction"

  /finance/share-links:
    get:
      operationId: getCustomerShareLinks
      tags: [finance]
      summary: List expiring customer access links without returning tokens
      parameters:
        - { name: customerId, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Share links
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CustomerShareLink" }
    post:
      operationId: createCustomerShareLink
      tags: [finance]
      summary: Create a short-lived customer invoice or repair link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerShareLinkInput"
      responses:
        "201":
          description: Link token, returned only once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerShareLinkCreated"

