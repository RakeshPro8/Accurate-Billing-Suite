        channel: { type: string, enum: [email, sms] }
        subject: { type: string, maxLength: 200 }
        body: { type: string, maxLength: 5000 }
        enabled: { type: boolean }
        maxRetries: { type: integer, minimum: 0, maximum: 5 }

    NotificationTemplateUpdate:
      type: object
      additionalProperties: false
      properties:
        event: { type: string, enum: [invoice, estimate, repair-status, pickup, payment, reminder] }
        channel: { type: string, enum: [email, sms] }
        subject: { type: string, maxLength: 200 }
        body: { type: string, maxLength: 5000 }
        enabled: { type: boolean }
        maxRetries: { type: integer, minimum: 0, maximum: 5 }

    NotificationTemplate:
      allOf:
        - $ref: "#/components/schemas/NotificationTemplateInput"
        - type: object
          required: [id, storeId, createdAt, updatedAt]
          properties:
            id: { type: integer }
            storeId: { type: integer }
            createdAt: { type: string }
            updatedAt: { type: string }

    NotificationEventInput:
      type: object
      additionalProperties: false
      required: [customerId, event, channel]
